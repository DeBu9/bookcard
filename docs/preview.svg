<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" role="img" aria-label="读书卡界面预览：首页、记录页、我的页">
  <defs>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8613C"/>
      <stop offset="1" stop-color="#C79A6B"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBE3D5"/>
      <stop offset="1" stop-color="#D9CEBA"/>
    </linearGradient>
    <linearGradient id="fadeout" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4EFE6" stop-opacity="0"/>
      <stop offset="1" stop-color="#F4EFE6" stop-opacity="1"/>
    </linearGradient>
    <style>
      .bg      { fill: #FAF7F0; }
      .screen  { fill: #F4EFE6; stroke: #E0D7C6; stroke-width: 1.5; }
      .sans    { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
      .serif   { font-family: Georgia, 'Songti SC', 'Noto Serif CJK SC', 'Source Han Serif SC', serif; }
      .ink     { fill: #26231E; }
      .ink2    { fill: #564E44; }
      .muted   { fill: #948B7D; }
      .faint   { fill: #B4AB9C; }
      .accent  { fill: #A8613C; }
      .paper   { fill: #FFFDF9; stroke: #E7DFD0; }
      .field   { fill: #FFFDF9; stroke: #E7DFD0; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="880" height="580"/>

  <!-- ============ 首页 ============ -->
  <g transform="translate(16,0)">
    <rect class="screen" x="0" y="14" width="268" height="520" rx="28"/>

    <text class="serif ink" x="14" y="58" font-size="17" font-weight="600" letter-spacing="0.3">读书卡</text>
    <text class="sans muted" x="14" y="74" font-size="8" letter-spacing="0.2">把读过的话，留给未来的自己</text>

    <rect class="field" x="14" y="84" width="240" height="30" rx="9"/>
    <circle cx="28" cy="98" r="5" fill="none" stroke="#948B7D" stroke-width="1.4"/>
    <line x1="32" y1="102" x2="35.5" y2="105.5" stroke="#948B7D" stroke-width="1.4" stroke-linecap="round"/>
    <text class="sans muted" x="42" y="103" font-size="8">搜索书名、作者、章节、摘录、标签…</text>

    <text class="serif ink" x="14" y="136" font-size="14" font-weight="600">全部摘录</text>
    <text class="sans muted" x="254" y="136" font-size="8" text-anchor="end">3 张</text>

    <!-- 卡片 1 -->
    <rect class="paper" x="14" y="146" width="240" height="190" rx="13"/>
    <rect x="14" y="166" width="2" height="150" rx="1" fill="url(#spine)"/>
    <text class="serif ink" x="26" y="170" font-size="11" font-weight="600">人类简史</text>
    <text class="sans muted" x="26" y="183" font-size="8">尤瓦尔·赫拉利</text>
    <circle cx="234" cy="166" r="1.8" fill="#B4AB9C"/>
    <circle cx="240" cy="166" r="1.8" fill="#B4AB9C"/>
    <text class="serif ink" x="26" y="209" font-size="13">我们以为自己比祖先更幸福，</text>
    <text class="serif ink" x="26" y="229" font-size="13">其实只是换了一种匮乏。</text>
    <text class="sans muted" x="26" y="247" font-size="8">第四章 · 帝国的愿景</text>
    <line x1="26" y1="259" x2="26" y2="279" stroke="#DDCBB5" stroke-width="2"/>
    <text class="sans" x="33" y="270" font-size="9" fill="#6E6659">消费主义承诺快乐可以购买。</text>
    <rect x="26" y="288" width="34" height="16" rx="8" fill="#F1EAE0"/>
    <text class="sans" x="43" y="299" font-size="7.5" fill="#796E5E" text-anchor="middle">历史</text>
    <rect x="64" y="288" width="52" height="16" rx="8" fill="#F1EAE0"/>
    <text class="sans" x="90" y="299" font-size="7.5" fill="#796E5E" text-anchor="middle">认知革命</text>
    <text class="sans" x="26" y="320" font-size="7.5" fill="#B4AB9C" letter-spacing="0.3">2026-09-16</text>

    <!-- 卡片 2（被底部导航遮挡） -->
    <rect class="paper" x="14" y="348" width="240" height="130" rx="13"/>
    <rect x="14" y="368" width="2" height="90" rx="1" fill="url(#spine)"/>
    <text class="serif ink" x="26" y="372" font-size="11" font-weight="600">月亮与六便士</text>
    <text class="sans muted" x="26" y="385" font-size="8">毛姆</text>
    <text class="serif ink" x="26" y="411" font-size="13">我用尽了全力，过着平凡的一生。</text>

    <rect x="0" y="436" width="268" height="98" fill="url(#fadeout)"/>

    <!-- 底部导航 -->
    <rect x="0" y="490" width="268" height="44" fill="#FFFDF9"/>
    <line x1="0" y1="490" x2="268" y2="490" stroke="#E7DFD0"/>
    <path d="M39 504.5A2 2 0 0 1 41 502.5H52v12H41A2 2 0 0 0 39 516.5z" fill="none" stroke="#A8613C" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M39 516.5A2 2 0 0 1 41 514.5H52v2z" fill="none" stroke="#A8613C" stroke-width="1.4" stroke-linejoin="round"/>
    <text class="sans accent" x="45" y="528" font-size="7.3" text-anchor="middle" font-weight="600" letter-spacing="0.3">首页</text>

    <circle cx="134" cy="498" r="15" fill="#2C2924"/>
    <line x1="134" y1="491.5" x2="134" y2="504.5" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <line x1="127.5" y1="498" x2="140.5" y2="498" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <text class="sans" x="134" y="528" font-size="7.3" text-anchor="middle" fill="#A79E8F" letter-spacing="0.3">记录</text>

    <circle cx="210" cy="505" r="2.6" fill="none" stroke="#A79E8F" stroke-width="1.4"/>
    <path d="M205 516c.5-2.7 2.5-4.2 5-4.2s4.5 1.5 5 4.2" fill="none" stroke="#A79E8F" stroke-width="1.4" stroke-linecap="round"/>
    <text class="sans" x="210" y="528" font-size="7.3" text-anchor="middle" fill="#A79E8F" letter-spacing="0.3">我的</text>

    <text class="sans muted" x="134" y="556" font-size="10" text-anchor="middle" letter-spacing="0.5">首页 · 卡片列表与搜索</text>
  </g>

  <!-- ============ 记录页 ============ -->
  <g transform="translate(306,0)">
    <rect class="screen" x="0" y="14" width="268" height="520" rx="28"/>

    <text class="serif ink" x="14" y="58" font-size="17" font-weight="600" letter-spacing="0.3">读书卡</text>
    <!-- 保存按钮并入吸顶品牌栏，与标题同一水平线 -->
    <rect x="165" y="40" width="89" height="24" rx="8" fill="#2C2924"/>
    <text class="sans" x="209.5" y="55.5" font-size="9" fill="#FFFFFF" text-anchor="middle">保存这张读书卡</text>
    <text class="sans muted" x="14" y="74" font-size="8" letter-spacing="0.2">把读过的话，留给未来的自己</text>

    <text class="serif ink" x="14" y="102" font-size="14" font-weight="600">记录一张读书卡</text>

    <rect x="14" y="112" width="240" height="68" rx="11" fill="#FBF8F1" stroke="#D3C9B8" stroke-dasharray="4 3"/>
    <rect x="76" y="126" width="116" height="24" rx="12" fill="#2C2924"/>
    <text class="sans" x="134" y="141.5" font-size="9" fill="#FFFFFF" text-anchor="middle">拍照 / 截图识别</text>
    <text class="sans muted" x="134" y="166" font-size="7.5" text-anchor="middle">支持中文 + 英文，首次需联网下载语言包</text>

    <text class="sans" x="14" y="196" font-size="8" fill="#7B7263" letter-spacing="0.3">书名</text>
    <rect class="field" x="14" y="202" width="240" height="30" rx="9"/>
    <text class="sans faint" x="24" y="221" font-size="8">例如：活着</text>

    <text class="sans" x="14" y="248" font-size="8" fill="#7B7263" letter-spacing="0.3">作者</text>
    <rect class="field" x="14" y="254" width="115" height="30" rx="9"/>
    <text class="sans faint" x="24" y="273" font-size="8">余华</text>
    <text class="sans" x="139" y="248" font-size="8" fill="#7B7263" letter-spacing="0.3">章节</text>
    <rect class="field" x="139" y="254" width="115" height="30" rx="9"/>
    <text class="sans faint" x="149" y="273" font-size="8">第三章 / 第45页</text>

    <text class="sans" x="14" y="302" font-size="8" fill="#7B7263" letter-spacing="0.3">摘录内容</text>
    <rect class="field" x="14" y="308" width="240" height="76" rx="9"/>
    <text class="sans faint" x="24" y="326" font-size="8">把你想留下来的那句话写在这里……</text>

    <text class="sans" x="14" y="402" font-size="8" fill="#7B7263" letter-spacing="0.3">我的想法（可选）</text>
    <rect class="field" x="14" y="408" width="240" height="50" rx="9"/>
    <text class="sans faint" x="24" y="426" font-size="8">为什么这句话打动了你？</text>

    <rect x="0" y="490" width="268" height="44" fill="#FFFDF9"/>
    <line x1="0" y1="490" x2="268" y2="490" stroke="#E7DFD0"/>
    <path d="M39 504.5A2 2 0 0 1 41 502.5H52v12H41A2 2 0 0 0 39 516.5z" fill="none" stroke="#A79E8F" stroke-width="1.4" stroke-linejoin="round"/>
    <text class="sans" x="45" y="528" font-size="7.3" text-anchor="middle" fill="#A79E8F" letter-spacing="0.3">首页</text>

    <circle cx="134" cy="498" r="15" fill="#2C2924"/>
    <line x1="134" y1="491.5" x2="134" y2="504.5" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <line x1="127.5" y1="498" x2="140.5" y2="498" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <text class="sans accent" x="134" y="528" font-size="7.3" text-anchor="middle" font-weight="600" letter-spacing="0.3">记录</text>

    <circle cx="210" cy="505" r="2.6" fill="none" stroke="#A79E8F" stroke-width="1.4"/>
    <path d="M205 516c.5-2.7 2.5-4.2 5-4.2s4.5 1.5 5 4.2" fill="none" stroke="#A79E8F" stroke-width="1.4" stroke-linecap="round"/>
    <text class="sans" x="210" y="528" font-size="7.3" text-anchor="middle" fill="#A79E8F" letter-spacing="0.3">我的</text>

    <text class="sans muted" x="134" y="556" font-size="10" text-anchor="middle" letter-spacing="0.5">记录 · 保存按钮在顶栏，无需回滚</text>
  </g>

  <!-- ============ 我的 ============ -->
  <g transform="translate(596,0)">
    <rect class="screen" x="0" y="14" width="268" height="520" rx="28"/>

    <text class="serif ink" x="14" y="58" font-size="17" font-weight="600" letter-spacing="0.3">读书卡</text>
    <text class="sans muted" x="14" y="74" font-size="8" letter-spacing="0.2">把读过的话，留给未来的自己</text>

    <text class="serif ink" x="14" y="104" font-size="14" font-weight="600">我的</text>

    <rect class="paper" x="14" y="114" width="74" height="50" rx="11"/>
    <text class="serif ink" x="51" y="137" font-size="15" font-weight="600" text-anchor="middle">12</text>
    <text class="sans muted" x="51" y="151" font-size="7.5" text-anchor="middle">张读书卡</text>

    <rect class="paper" x="97" y="114" width="74" height="50" rx="11"/>
    <text class="serif ink" x="134" y="137" font-size="15" font-weight="600" text-anchor="middle">5</text>
    <text class="sans accent" x="134" y="151" font-size="7.5" text-anchor="middle" font-weight="600">本读过的书</text>

    <rect class="paper" x="180" y="114" width="74" height="50" rx="11"/>
    <text class="serif ink" x="217" y="137" font-size="15" font-weight="600" text-anchor="middle">18</text>
    <text class="sans muted" x="217" y="151" font-size="7.5" text-anchor="middle">个标签</text>

    <text class="serif ink" x="14" y="192" font-size="10" font-weight="600" letter-spacing="0.3">数据管理</text>

    <rect class="paper" x="14" y="202" width="115" height="34" rx="9"/>
    <text class="sans ink2" x="71.5" y="223" font-size="9" text-anchor="middle">导出 JSON</text>
    <rect class="paper" x="139" y="202" width="115" height="34" rx="9"/>
    <text class="sans ink2" x="196.5" y="223" font-size="9" text-anchor="middle">导出 TXT</text>
    <rect class="paper" x="14" y="246" width="115" height="34" rx="9"/>
    <text class="sans ink2" x="71.5" y="267" font-size="9" text-anchor="middle">导入 JSON</text>
    <rect class="paper" x="139" y="246" width="115" height="34" rx="9"/>
    <text class="sans ink2" x="196.5" y="267" font-size="9" text-anchor="middle">导入 TXT</text>

    <text class="sans muted" x="14" y="306" font-size="7.5">数据只保存在本机，不上传服务器。</text>
    <text class="sans muted" x="14" y="318" font-size="7.5">导出 JSON 是完整备份，可在任意设备导入还原。</text>
    <text class="sans muted" x="14" y="330" font-size="7.5">定期导出可避免清理应用数据时丢失。</text>

    <rect x="0" y="490" width="268" height="44" fill="#FFFDF9"/>
    <line x1="0" y1="490" x2="268" y2="490" stroke="#E7DFD0"/>
    <path d="M39 504.5A2 2 0 0 1 41 502.5H52v12H41A2 2 0 0 0 39 516.5z" fill="none" stroke="#A79E8F" stroke-width="1.4" stroke-linejoin="round"/>
    <text class="sans" x="45" y="528" font-size="7.3" text-anchor="middle" fill="#A79E8F" letter-spacing="0.3">首页</text>

    <circle cx="134" cy="498" r="15" fill="#2C2924"/>
    <line x1="134" y1="491.5" x2="134" y2="504.5" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <line x1="127.5" y1="498" x2="140.5" y2="498" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <text class="sans" x="134" y="528" font-size="7.3" text-anchor="middle" fill="#A79E8F" letter-spacing="0.3">记录</text>

    <circle cx="210" cy="505" r="2.6" fill="none" stroke="#A8613C" stroke-width="1.4"/>
    <path d="M205 516c.5-2.7 2.5-4.2 5-4.2s4.5 1.5 5 4.2" fill="none" stroke="#A8613C" stroke-width="1.4" stroke-linecap="round"/>
    <text class="sans accent" x="210" y="528" font-size="7.3" text-anchor="middle" font-weight="600" letter-spacing="0.3">我的</text>

    <text class="sans muted" x="134" y="556" font-size="10" text-anchor="middle" letter-spacing="0.5">我的 · 统计可点进二级页</text>
  </g>
</svg>
